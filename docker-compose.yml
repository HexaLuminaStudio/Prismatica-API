services:
  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    container_name: prismatica-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Linux 容器通过宿主机网关访问宝塔安装的 MySQL；无需开放公网 3306。
      DB_HOST: ${DOCKER_DB_HOST:-host.docker.internal}
      REDIS_URL: redis://redis:6379/0
      RATELIMIT_STORAGE_URI: redis://redis:6379/1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: prismatica-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
