# Prismatica API 单公网入口。
# 宝塔中应把本文件作为一个完整的 server 配置启用，不要嵌套进另一个 server 块。
server {
    listen 8000 default_server;
    server_name _;

    client_max_body_size 50m;
    keepalive_timeout 65s;

    # 后端接口：管理员登录/用户管理/API 统一由内部服务处理，防止 SPA 路由误食。
    location ^~ /admin {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header Connection "";

        proxy_connect_timeout 3s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_buffering on;
        add_header X-Prismatica-Upstream fast-api always;
    }

    # AI/SSE 流式请求：关闭代理缓冲并使用独立长超时。
    location ^~ /v1/ai/ {
        proxy_pass http://127.0.0.1:8101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header Connection "";

        proxy_connect_timeout 3s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        gzip off;
        add_header X-Accel-Buffering no always;
        add_header X-Prismatica-Upstream ai always;
    }

    # 资源流式下载：与普通 API 分离，避免大文件长期占用快速请求槽位。
    location ^~ /v1/resources/download/ {
        proxy_pass http://127.0.0.1:8102;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header Connection "";

        proxy_connect_timeout 3s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        add_header X-Accel-Buffering no always;
        add_header X-Prismatica-Upstream resources always;
    }

    # 登录、余额、流水、Admin 及其余 API 短请求。
    location ^~ /v1/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header Connection "";

        proxy_connect_timeout 3s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_buffering on;
        add_header X-Prismatica-Upstream fast-api always;
    }

    # 健康检查仍走后端，便于运维脚本直连。
    location = /healthz {
        proxy_pass http://127.0.0.1:8100/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 前端单页应用回退：所有非后端 API 路由命中 /index.html，解决 /pricing /users 等直接打开 404。
    location / {
        root /www/wwwroot/prismatica-admin/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
