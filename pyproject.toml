[project]
name = "prismatica-backend"
version = "0.1.0"
description = "Prismatica 云端后端(用户登录 + 积分结算)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "Flask>=3.0.3",
    "SQLAlchemy>=2.0.30",
    "PyMySQL>=1.1.1",
    "cryptography>=42.0.0",
    "PyJWT>=2.8.0",
    "bcrypt>=5.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "loguru>=0.7.2",
    "Flask-Limiter>=3.8.0",
    "redis>=5.0.4",
    "prometheus-client>=0.20.0",
    "gunicorn>=22.0.0",
    "requests>=2.34.2",
    "flask-cors",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["B008"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra -q"
pythonpath = ["."]
python_files = ["test_*.py", "*_test.py", "smoke_admin_e2e.py"]

[[tool.uv.index]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
